# CI + despliegue del portfolio a Cloudflare Workers (static assets).
#
# - Cada push y PR: astro check + build (si algo se rompe, lo ves aquí antes de publicar).
# - Push a main / ejecución manual / cada lunes: build y deploy, pero SOLO si el repo
#   tiene la variable SITE_URL. Hasta que compres el dominio, el deploy se salta solo.
#   El cron semanal sirve para refrescar la sección de repos de GitHub (se lee en build).
#
# Para activarlo (Settings → Secrets and variables → Actions):
#   Variables: SITE_URL              = https://tu-dominio
#   Secrets:   CLOUDFLARE_API_TOKEN  = token con permiso "Workers Scripts: Edit"
#              CLOUDFLARE_ACCOUNT_ID = ID de tu cuenta de Cloudflare
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
